name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version label
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $label = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $label = "0.1.0-build$($env:GITHUB_RUN_NUMBER)"
          }
          "label=$label" >> $env:GITHUB_OUTPUT
          Write-Host "Version label: $label"

      - name: Configure
        # No -G: CMake picks whichever Visual Studio the runner has installed.
        # The -D argument is quoted because PowerShell splits it at the dots.
        run: cmake -S . -B build -A x64 "-DVA_VERSION_LABEL=${{ steps.ver.outputs.label }}"

      - name: Build plugin (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --target VocalAssistor_VST3 --parallel 2>&1 | Tee-Object -FilePath build-output.txt
          if ($LASTEXITCODE -ne 0) {
            # Surface the compiler errors as annotations so they can be read without downloading logs.
            Select-String -Path build-output.txt -Pattern 'error' | Select-Object -First 12 | ForEach-Object {
              $msg = ($_.Line -replace '[\r\n%]', ' ')
              Write-Host "::error::$msg"
            }
            exit 1
          }

      - name: Build and run the unit and host tests
        # Phase gate: a failing test fails the build.
        shell: pwsh
        run: |
          foreach ($t in 'PitchTests', 'BlockTests', 'HostTests') {
            cmake --build build --config Release --target $t --parallel
            if ($LASTEXITCODE -ne 0) { throw "$t did not build" }
          }
          $failed = @()
          foreach ($t in 'PitchTests', 'BlockTests', 'HostTests') {
            $exe = Get-ChildItem -Path build -Recurse -Filter "$t.exe" | Select-Object -First 1
            "===== $t =====" | Tee-Object -FilePath test-output.txt -Append
            & $exe.FullName 2>&1 | Tee-Object -FilePath test-output.txt -Append
            if ($LASTEXITCODE -ne 0) { $failed += $t }
          }
          if ($failed.Count -gt 0) { throw "Tests failed: $($failed -join ', ')" }

      - name: Locate the built plugin
        id: find
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Recurse -Directory -Filter "Vocal Assistor.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "Vocal Assistor.vst3 was not produced" }
          Write-Host "Found $($bundle.FullName)"
          "bundle=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
          "dir=$($bundle.Parent.FullName)" >> $env:GITHUB_OUTPUT
          Get-ChildItem -Path $bundle.FullName -Recurse -File | ForEach-Object { Write-Host $_.FullName }

      - name: Zip the .vst3 folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/VocalAssistor-${{ steps.ver.outputs.label }}-win64-vst3.zip"
          Compress-Archive -Path "${{ steps.find.outputs.bundle }}" -DestinationPath $zip -Force
          Copy-Item docs/INSTALL.txt dist/INSTALL.txt

      - name: Build the Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.label }}" "/DBuildDir=${{ steps.find.outputs.dir }}" "/O$PWD\dist" installer\VocalAssistor.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: VocalAssistor-${{ steps.ver.outputs.label }}-win64
          path: |
            dist/*
            test-output.txt

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.exe
            dist/INSTALL.txt
            test-output.txt
