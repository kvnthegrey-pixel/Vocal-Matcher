name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version label
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $label = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $label = "0.1.0-dev"
          }
          "label=$label" >> $env:GITHUB_OUTPUT
          Write-Host "Version label: $label"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DVA_VERSION_LABEL=${{ steps.ver.outputs.label }}

      - name: Build plugin (Release)
        run: cmake --build build --config Release --target VocalAssistor_VST3 --parallel

      - name: Build and run pitch spike
        # Informational in Phase 1: the spike currently reports one failing
        # sine (110 Hz), which Phase 2 fixes. It must not block the release.
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --config Release --target PitchSpike --parallel
          $exe = Get-ChildItem -Path build -Recurse -Filter PitchSpike.exe | Select-Object -First 1
          & $exe.FullName | Tee-Object -FilePath spike-output.txt

      - name: Locate the built plugin
        id: find
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Recurse -Directory -Filter "Vocal Assistor.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "Vocal Assistor.vst3 was not produced" }
          Write-Host "Found $($bundle.FullName)"
          "bundle=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
          "dir=$($bundle.Parent.FullName)" >> $env:GITHUB_OUTPUT
          Get-ChildItem -Path $bundle.FullName -Recurse -File | ForEach-Object { Write-Host $_.FullName }

      - name: Zip the .vst3 folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/VocalAssistor-${{ steps.ver.outputs.label }}-win64-vst3.zip"
          Compress-Archive -Path "${{ steps.find.outputs.bundle }}" -DestinationPath $zip -Force
          Copy-Item docs/INSTALL.txt dist/INSTALL.txt

      - name: Build the Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.label }}" "/DBuildDir=${{ steps.find.outputs.dir }}" "/O$PWD\dist" installer\VocalAssistor.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: VocalAssistor-${{ steps.ver.outputs.label }}-win64
          path: |
            dist/*
            spike-output.txt

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.exe
            dist/INSTALL.txt
            spike-output.txt
